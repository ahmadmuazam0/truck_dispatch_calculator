[package]
name = "truck-load-calculator"
version = "1.0.0"
description = "Truck Load Profit Calculator"
authors = ["Truck Load Calculator"]
edition = "2021"

[lib]
name = "truck_load_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
