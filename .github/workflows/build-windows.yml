name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm install

      - name: Show Tauri environment
        run: npm run tauri -- info

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis --verbose

      - name: Show generated files
        if: always()
        shell: powershell
        run: |
          Write-Host "Release output:"
          if (Test-Path "src-tauri\target\release") {
            Get-ChildItem "src-tauri\target\release" -Recurse -File | Select-Object FullName
          }

      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Truck-Load-Calculator-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
