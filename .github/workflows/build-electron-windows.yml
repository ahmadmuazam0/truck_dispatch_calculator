name: Build Electron Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository is Electron-only
        shell: powershell
        run: |
          if (Test-Path "src-tauri") {
            Write-Error "Old Tauri folder src-tauri is still present. Delete it."
            exit 1
          }
          if (Test-Path "Cargo.toml") {
            Write-Error "Old Cargo.toml is still present. Delete it."
            exit 1
          }
          Write-Host "Clean Electron repository confirmed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win

      - name: Show generated files
        shell: powershell
        run: |
          if (Test-Path "dist") {
            Get-ChildItem "dist" -Recurse -File | Select-Object FullName
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Truck-Dispatch-Calculator-Windows
          path: dist/*.exe
          if-no-files-found: error
